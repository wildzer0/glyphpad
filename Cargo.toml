[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
# Single source of truth for the version (SPEC §11.1); bumped by `cargo xtask release`.
version = "1.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/wildzer0/glyphpad"
publish = false

[workspace.dependencies]
glyphpad-core = { path = "crates/core" }
glyphpad-platform = { path = "crates/platform" }
glyphpad-actions = { path = "crates/actions" }
glyphpad-gui = { path = "crates/gui" }
glyphpad-updater = { path = "crates/updater" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Native file dialog for picking programs in the action editor (SPEC §10.2).
rfd = "0.17.2"
# Native window handle of the eframe window, to bring it to the front on Windows.
raw-window-handle = "0.6.2"
# Channels with select! across several receivers, used by the engine for gesture timeouts.
crossbeam-channel = "0.5.17"
# GUI (SPEC §10.1): glow backend, lighter than wgpu.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Standard per-OS config directory when not running in portable mode (SPEC §2).
directories = "6.0.0"
# Hot reload of the configuration (SPEC §9).
# No default features: the only one is the macOS backend (out of scope).
notify = { version = "8.2.0", default-features = false }
# Window-title conditions (`when.title`) are regular expressions (SPEC §9).
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
# System tray icon and menu (SPEC §10.1).
tray-icon = "0.26.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"
jiff = "0.2.38"
# Property-based tests of the recognizer (SPEC §8).
proptest = "1.12.0"
semver = "1.0.28"
# Update downloads (SPEC §12.2): rustls with bundled roots, no OpenSSL and no system
# certificate store, so the single executable stays portable.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# SHA256SUMS verification of downloaded packages (SPEC §12.3).
sha2 = "0.11.1"
minisign-verify = "0.3.0"
# Package extraction: .zip on Windows, .tar.gz on Linux (SPEC §11.3).
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4.46"
# Scratch directories in the updater's tests.
tempfile = "3.27.0"
toml_edit = "0.25.17"
# The system language, to pick the window's language when set to "system".
sys-locale = "0.3.2"

[workspace.lints.rust]
# SPEC §2: no `unsafe` outside platform FFI modules, which opt in with `#[allow(unsafe_code)]`.
unsafe_code = "deny"

# The recognizer is ~20x slower unoptimized; optimize the core even in dev
# and test builds so tests stay fast and debug builds stay usable on hardware.
[profile.dev.package.glyphpad-core]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Kept as unwind so a panicking backend thread can be caught and restarted (SPEC §2, robustness).
panic = "unwind"
