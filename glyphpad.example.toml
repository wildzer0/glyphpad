# GlyphPad configuration.
#
# Portable mode: put this file next to glyphpad.exe as `glyphpad.toml`.
# Otherwise GlyphPad uses the OS config directory (on Windows
# %APPDATA%\GlyphPad\config\glyphpad.toml) and creates it on first start.
# Check a file with `glyphpad check-config <file>`.

config_version = 1

[settings]
active_profile = "default"

# Thresholds. Distances are millimeters, so they work on any touchpad size.
tap_max_duration_ms = 250
tap_max_movement_mm = 4.0
multi_tap_gap_ms = 300
hold_duration_ms = 600
hold_max_movement_mm = 4.0
swipe_min_distance_mm = 18.0
swipe_min_speed_mm_s = 60.0

# Drawn symbols. Windows keeps moving the pointer while you touch the
# touchpad, so symbols are drawn in a way it ignores:
#   { mode = "fingers", count = 3 }        three fingers (turn off Windows'
#                                          own three-finger gestures)
#   { mode = "edge", edge = "left", zone_percent = 10 }   one finger starting
#                                          at the left edge
#   { mode = "hold", ms = 400 }            rest one finger, then draw
#   { mode = "toggle" }                    one finger, after a gesture with
#                                          the `draw_symbol` action
# One-finger modes accept `freeze_cursor = true` (experimental) to pin the
# pointer while drawing.
draw_activation = { mode = "fingers", count = 3 }
stroke_gap_ms = 400          # pause that ends a symbol (an X has two strokes)
min_stroke_mm = 10.0
default_confidence = 0.80    # below this score nothing happens
rotation_tolerance_deg = 0.0 # 0: a rotated L is not an L

# Window and tray.
close_to_tray = true         # the window's X hides GlyphPad to the tray
start_minimized = false
history_size = 20            # recognitions kept in "Review gestures"
save_history = false         # also write them to history.jsonl

# repeat_last re-runs the last gesture's action.
repeat_same_app_only = true  # never into another application
# repeat_timeout_s = 60

# On-screen feedback: the stroke while drawing, then the gesture's name.
# `notify` actions are shown here too.
overlay = { enabled = true, position = "bottom_right", duration_ms = 1500, opacity = 0.85, width_px = 240 }

# Pause gestures while one of these apps, or any full-screen app, is in front.
pause_in_apps = []
pause_when_fullscreen = true
autostart = false            # start with Windows
backup_count = 10            # earlier versions kept in backups/

[update]
mode = "notify"          # off | notify | auto
channel = "stable"       # stable | prerelease
check_interval_h = 24

# Gestures, in priority order: when two could fire, the first one wins.
#
# Windows has its own 3- and 4-finger gestures (Settings → Bluetooth & devices
# → Touchpad). Turn off the ones you replace here, or both will run.

# Built-in symbols: L, q, X, C, V, Z, O, arrow-up, arrow-down. Record your
# own examples with `glyphpad record <name>` for better recognition.

[[gesture]]
name = "lock"
type = "symbol"
symbol = "L"
action = { type = "lock_screen" }

[[gesture]]
name = "close-app"
type = "symbol"
symbol = ["q", "X"]
confidence = 0.85
action = { type = "close_window", force = false }

[[gesture]]
name = "show-desktop"
type = "tap"
fingers = 4
action = { type = "keys", combo = "Win+D" }

[[gesture]]
name = "play-pause"
type = "tap"
fingers = 5
action = { type = "media", key = "play_pause" }

[[gesture]]
name = "hello"
type = "hold"
fingers = 5
action = { type = "notify", title = "GlyphPad", message = "Gestures are working" }

[[gesture]]
name = "repeat"
type = "tap"
fingers = 3
taps = 2
action = { type = "repeat_last" }

